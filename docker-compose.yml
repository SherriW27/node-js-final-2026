volumes:
  pgData:

services:
  # 健身房前端（成品，不要改它 — 它是你的驗收機）
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://127.0.0.1:8080/api/
    ports:
      - "3000:80"

  # API 文件（Swagger UI，瀏覽 + Try it out 試打你的後端）
  swagger:
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      - SWAGGER_JSON=/openapi.yaml
    volumes:
      - ./docs/openapi.yaml:/openapi.yaml:ro
    ports:
      - "8081:8080"

  # PostgreSQL（空的資料庫，等你的後端來建表）
  postgres:
    image: postgres:16.4-alpine3.20
    environment:
      - POSTGRES_USER=student
      - POSTGRES_PASSWORD=student666
      - POSTGRES_DB=fitness
    volumes:
      - pgData:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d fitness"]
      interval: 10s
      timeout: 3s
      retries: 3
  
  # ============================================================
  # W10 容器化挑戰：將專案內既有的 backend 加入 Docker Compose
  # 規則（GitHub Actions 的壓軸驗收按這個來）：
  #   - 服務名稱必須叫 backend
  #   - 對外要開 8080（"8080:你的PORT"）
  # 提示：
  #   - 在 backend/ 裡寫 Dockerfile
  #   - 在 backend/ 加上 .dockerignore，至少排除 node_modules 與 .env
  #   - build context 建議用 ./backend
  #   - 容器裡連資料庫，DB_HOST 不再是 localhost，而是 postgres
  #   - 要有 healthcheck（打你的 GET /healthcheck）
  #   - depends_on postgres 的 healthy
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      # 容器裡的 localhost 是「這個容器自己」；同一個 compose 網路裡，用服務名稱 postgres 找到資料庫
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=student
      - DB_PASSWORD=student666
      - DB_DATABASE=fitness
      - DB_ENABLE_SSL=false
      # JWT 密鑰：優先用你環境裡的 JWT_SECRET；沒有時才用下面這個「示範用」預設值（CI 沒有 .env 也能跑）
      # 真實專案不會把密鑰預設值放進版本控制，而是由部署平台注入
      - JWT_SECRET=${JWT_SECRET:-demo-only-jwt-secret-please-change}
      - JWT_EXPIRES_DAY=30d
      # 時區：預設 UTC（與 GitHub CI 一致）。M6 營收用「伺服器本機時間」判斷現在是幾月，
      # 想在自己的 Mac 上對齊台灣時間時：TZ=Asia/Taipei docker compose up -d backend
      - TZ=${TZ:-UTC}
    depends_on:
      postgres:
        # service_healthy：等 postgres 通過自己的健康檢查才啟動；只寫 depends_on 只保證「容器啟動」，不保證「資料庫準備好」
        condition: service_healthy
    healthcheck:
      # alpine 沒有 curl，改用 node 內建的 fetch 打 /healthcheck
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080/healthcheck').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 5
